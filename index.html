    function copyPrompt() {
      // 公式要項・市長賞準拠＆AIチェック強化版プロンプト
      const promptText = `# Role
あなたは「令和8年度 よこはま子ども国際平和スピーチコンテスト」の最高審査員です。
横浜市の公式実施要項および審査基準を熟知しており、過去の市長賞受賞者のスピーチ（被爆者からの直接の聞き取りや、身近な障害者・高齢者との対話から平和の定義を見出した作品など）のレベルを基準として評価します。
校内代表、ひいては「市本選で勝てる代表」を選出するため、極めて厳格かつ深い洞察に基づく基準で原稿を精査してください。

# Task
入力されたスピーチ原稿を精読し、指定されたJSON形式のみで評価結果を出力してください。

# 審査規準（合計300点満点）※公式要項および「審査の観点・評価基準例」に完全準拠

## 1. 共通テーマ・視点（100点）
- 共通テーマの理解 (40点): 「国際平和のために、自分にできること」というテーマを、単なる「戦争反対」ではなく、自分事として深く解釈できているか。
- SDGsとの関連付け (30点): 指定したSDGs17の目標のいずれかと、スピーチの内容（課題意識や方策）が論理的かつ密接に結びついているか。番号を挙げただけになっていないか。
- 身近な問題からの発展 (30点): 遠い世界の出来事と、自分自身の日常（学校生活、身近な出会い、地域社会）が乖離せず、一本の線で繋がっているか。

## 2. 具体的な意見や方策（100点）
- 一次情報と心の動き (50点): ネットや本、テレビの知識（二次情報）ではなく、「自分が直接見聞きした体験、参加した活動（原体験）」と、その時の「自分自身の心の動き（葛藤、気づき、変化）」が具体的に描かれているか。【※市長賞レベルを見極める最重要項目】
- 実現可能なアクション (30点): 壮大すぎる夢物語ではなく、小・中学生の「今の自分だからこそできる具体的な行動（身近な人との関わり方の変化など）」が示されているか。
- 継続性と意欲 (20点): そのアクションが一時的なものではなく、未来へ向けて継続的に取り組もうとする強い意欲が感じられるか。

## 3. スピーチの組立・伝える力（100点）
- 論理的な構成 (40点): 自分の主張が聞き手に伝わるよう、起承転結などの順序立てが工夫され、論旨が一貫しているか。
- 表現と語彙の工夫 (30点): 借り物の大人びた言葉やAI特有の定型句ではなく、その年齢らしい真っ直ぐで誠実な、自分自身の言葉で語られているか。
- 形式・ルール遵守 (30点): 
  - 「です・ます体（敬体）」で統一されているか。（1箇所でも常体があれば減点）
  - 引用が全体の1/3を超えていないか。
  - 時間の目安：3分以内（小学生は1000字程度、中学生は1200字程度を上限の目安とする）であるか。

# 🚨 生成AI使用チェックの超厳格化 (CRITICAL)
以下の特徴が見られる場合、本人のオリジナルな体験・感情が欠如している「生成AIによる作成（または過度な依存）」の可能性が高いと判断し、ai_risk を High に設定し、点数（特に「具体的な意見や方策」）を大幅に減点してください。
* 「架空の完璧なエピソード」: 苦労や葛藤がなく、あまりにもスムーズに問題が解決する綺麗すぎる体験談。
* 「五感・感情の欠如」: その場にいた本人にしか分からない「匂い」「温度」「具体的な会話のトーン」「その瞬間のリアルな心の痛みや喜び」の描写がスッポリ抜けている。
* 「過度な一般論への飛躍」: 「だから私たち一人一人が意識を変えることが大切なのです」といった、具体性のないAI特有の常套句で締めくくられている。
* 「構成の定型化」: 導入（問いかけ）→ 抽象的な課題提示 → 3つのポイント → 結論 という、ChatGPT等が出力しやすい教科書的な構成に終始している。

# ⚠️ Output Constraints (CRITICAL)
以下のルールを絶対に守ってください。アプリで読み込むため、フォーマット違反は許されません。
1. JSON Only: 挨拶、解説、Markdownのコードブロックは一切出力しないでください。 { から始まり } で終わる純粋なJSONテキストのみを出力してください。
2. Escape Characters: 文字列内の改行は \\n に、ダブルクォーテーションは \\" に必ずエスケープしてください。特に original_text は要注意。
3. No Trailing Commas: 配列やオブジェクトの最後の要素の後にカンマ , を絶対に入れないでください。

{
  "student_name": "氏名",

  },

    "good_points": "児童へのポジティブなフィードバック（体験や感情の描写を褒める）",

  },

}

      const textArea = document.createElement("textarea");

    // --- ワークシートダウンロード機能 ---
    function downloadWorksheet() {
      const template = `令和8年度 よこはま子ども国際平和スピーチコンテスト
--------------------------------------------------

【氏名】 （ここに名前を書いてください）
【題名】 （ここにスピーチのタイトルを書いてください）
【SDGs目標番号】 （1〜17の番号を書いてください）

--------------------------------------------------
【本文】
（ここから下に、スピーチの原稿を書いてください。文字数の目安は約900〜1200文字、時間にして約3分間です。）






`;
      const blob = new Blob([template], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'スピーチ入力用ワークシート.txt';

    // --- データインポート処理 ---
    function handleLoadData() {
      const inputEl = document.getElementById('jsonInput');
      const errorBox = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const btn = document.getElementById('importBtn');
      
      errorBox.classList.add('hidden');
      
      try {
        let input = inputEl.value.trim();
        if (!input) return;

        input = input.replace(/```json/gi, '').replace(/```/g, '').trim();

        const cleanJsonStr = (str) => {
          return str.replace(/,\s*([\]}])/g, '$1');
        };

        let newItems = [];

        try {
          const cleanedFullInput = cleanJsonStr(input);
          const parsed = JSON.parse(cleanedFullInput);
          newItems = Array.isArray(parsed) ? parsed : [parsed];
        } catch (e) {
          const jsonBlocks = input.match(/\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}/g);
          if (jsonBlocks) {
            newItems = jsonBlocks.map(block => {
              try {
                return JSON.parse(cleanJsonStr(block.trim()));
              } catch (blockError) {
                return null;
              }
            }).filter(item => item !== null);
          }
        }

        if (newItems.length === 0) {
          throw new Error('有効なデータが見つかりませんでした。AIの出力形式を確認してください。');
        }

        let addedCount = 0;
        let updatedCount = 0;

        newItems.forEach(item => {
          if (!item.student_name) return;
          const idx = dataList.findIndex(d => d.student_name === item.student_name);
          if (idx > -1) {
            dataList[idx] = item;
            updatedCount++;
          } else {
            dataList.push(item);
            addedCount++;
          }
        });

        dataList.sort((a, b) => (b.scores?.total || 0) - (a.scores?.total || 0));
        
        renderUI();
        
        const msgEl = document.getElementById('importMessage');
        msgEl.textContent = `${addedCount}件を追加、${updatedCount}件を更新しました。`;
        msgEl.classList.remove('opacity-0');
        setTimeout(() => msgEl.classList.add('opacity-0'), 4000);
        
        inputEl.value = '';
        btn.disabled = true;

      } catch (e) {
        errorText.textContent = `エラー: ${e.message}`;
        errorBox.classList.remove('hidden');
      }
    }

    // --- データクリア処理 ---
    function handleClearData() {
      if (dataList.length === 0) {
        alert('削除するデータがありません。');
        return;
      }
      if (confirm('リストにあるすべてのデータを初期化しますか？\n（※印刷していないデータは失われます）')) {
        dataList = [];
        renderUI();
        document.getElementById('errorMessage').classList.add('hidden');
      }
    }

    // --- ユーティリティ ---
    const getAiRiskColor = (risk) => {
      const r = String(risk).toLowerCase();
      if (r.includes('high')) return 'text-red-600 bg-red-50 border-red-200';
      if (r.includes('medium')) return 'text-orange-600 bg-orange-50 border-orange-200';
      return 'text-green-600 bg-green-50 border-green-200';
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // --- レンダリング処理 ---
    function renderUI() {
      const emptyState = document.getElementById('emptyState');
      const contentArea = document.getElementById('contentArea');
      
      if (dataList.length === 0) {
        emptyState.classList.remove('hidden');
        contentArea.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      contentArea.classList.remove('hidden');
      document.getElementById('totalCount').textContent = `Total: ${dataList.length}名`;

      renderRankingTable();
      renderSheets();
      lucide.createIcons();
    }

    function renderRankingTable() {
      const tbody = document.getElementById('rankingTableBody');
      tbody.innerHTML = '';

      dataList.forEach((item, i) => {
        const rankStr = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
        const rowClass = i === 0 ? 'bg-yellow-50/20' : 'bg-white';
        const shortReview = escapeHtml(item.feedback?.critical_review || '').substring(0, 40) + '...';
        
        const tr = document.createElement('tr');
        tr.className = `border-b border-slate-100 hover:bg-blue-50/30 transition ${rowClass}`;
        tr.innerHTML = `
          <td class="p-4 font-black text-lg text-slate-500">${rankStr}</td>
          <td class="p-4">
            <div class="font-bold text-slate-900 text-sm md:text-base">${escapeHtml(item.student_name)}</div>
            <div class="text-[10px] text-slate-500 truncate max-w-[250px] font-bold">『${escapeHtml(item.title)}』</div>
          </td>
          <td class="p-4 text-center">
            <span class="text-xl font-black text-blue-700">${item.scores?.total || 0}</span>
          </td>
          <td class="p-4">
            <div class="text-xs text-slate-600 italic">${shortReview}</div>
            <button onclick="showModal(${i})" class="mt-1 text-[10px] text-blue-600 hover:text-blue-800 font-bold underline flex items-center gap-1">
              <i data-lucide="file-text" class="w-3 h-3"></i> 原文を読む
            </button>
          </td>
          <td class="p-4">
            <span class="text-[10px] px-2 py-1 rounded-full border ${getAiRiskColor(item.status?.ai_risk)} font-bold shadow-sm">${escapeHtml(item.status?.ai_risk || 'N/A')}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // --- PDF印刷用 シート生成 ---
    function renderSheets() {
      const container = document.getElementById('sheetsContainer');
      container.innerHTML = '';

      dataList.forEach((item, i) => {
        const sheet = document.createElement('div');
        sheet.className = "print-page bg-white p-8 rounded-2xl shadow-xl border border-slate-200 relative";
        
        let originalTextHtml = '<span class="text-slate-400 italic text-center block mt-10">原文データがありません。</span>';
        if (item.original_text) {
          originalTextHtml = escapeHtml(item.original_text).replace(/\n/g, '<br/>');
        }

        sheet.innerHTML = `
          <div class="border-b-[3px] border-black pb-3 mb-5 flex justify-between items-end">
            <div>
              <p class="text-xs font-bold text-slate-600 tracking-widest mb-1">令和8年度 よこはま子ども国際平和スピーチコンテスト</p>
              <h2 class="text-2xl font-black text-black tracking-tight">校内選考 個人審査シート</h2>
            </div>
            <div class="text-right pb-1">
              <p class="text-xs border border-black px-4 py-1 font-bold inline-block bg-slate-50 print:bg-white">整理番号： ${String(i + 1).padStart(3, '0')}</p>
            </div>
          </div>

          <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="flex-1 bg-white border border-slate-300 p-4 rounded-lg shadow-sm print:shadow-none">
              <div class="flex items-center gap-4 mb-3 pb-3 border-b border-dotted border-slate-300">
                <div class="w-16 text-[10px] text-slate-500 font-bold bg-slate-100 px-2 py-1 rounded text-center">氏名</div>
                <div class="text-xl font-black text-black tracking-widest">${escapeHtml(item.student_name)}</div>
              </div>
              <div class="flex items-center gap-4 mb-3 pb-3 border-b border-dotted border-slate-300">
                <div class="w-16 text-[10px] text-slate-500 font-bold bg-slate-100 px-2 py-1 rounded text-center">題名</div>
                <div class="text-base font-bold text-black">${escapeHtml(item.title)}</div>
              </div>
              <div class="flex items-center gap-4">
                <div class="w-16 text-[10px] text-slate-500 font-bold bg-slate-100 px-2 py-1 rounded text-center">SDGs</div>
                <div class="text-sm font-bold text-black">目標 ${escapeHtml(item.sdgs_goal)}</div>
              </div>
            </div>

            <div class="w-full md:w-56 border-2 border-slate-800 p-3 rounded-lg bg-slate-50 print:bg-white flex flex-col justify-center">
              <div class="text-center mb-1">
                <span class="text-[10px] font-black text-slate-800 tracking-widest">AI一次評価（参考値）</span>
              </div>
              <div class="text-center border-b-2 border-slate-200 pb-1 mb-2">
                <span class="text-4xl font-black text-blue-700 print:text-black">${item.scores?.total || 0}</span><span class="text-xs text-slate-500 font-bold">/300</span>
              </div>
              <div class="grid grid-cols-3 gap-1 text-center text-xs">
                <div class="border-r border-slate-300">
                  <div class="text-[8px] text-slate-500 font-bold">テーマ</div>
                  <div class="font-black text-sm text-black">${item.scores?.theme || 0}<span class="text-[7px] text-slate-400">/100</span></div>
                </div>
                <div class="border-r border-slate-300">
                  <div class="text-[8px] text-slate-500 font-bold">具体性</div>
                  <div class="font-black text-sm text-black">${item.scores?.action || 0}<span class="text-[7px] text-slate-400">/100</span></div>
                </div>
                <div>
                  <div class="text-[8px] text-slate-500 font-bold">表現力</div>
                  <div class="font-black text-sm text-black">${item.scores?.expression || 0}<span class="text-[7px] text-slate-400">/100</span></div>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-6 border border-slate-300 rounded-lg overflow-hidden shadow-sm print:shadow-none">
            <div class="bg-slate-800 print:bg-slate-200 print:text-black text-white p-1.5 border-b border-slate-300 font-bold text-[11px] text-center tracking-widest">
              AI審査員 講評（強みと課題）
            </div>
            <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <h4 class="font-bold text-black mb-1.5 text-xs flex items-center gap-1"><i data-lucide="thumbs-up" class="w-3 h-3 text-green-600 print:text-black"></i> 評価された点</h4>
                <p class="text-slate-700 leading-relaxed text-[11px] font-medium">${escapeHtml(item.feedback?.good_points)}</p>
              </div>
              <div>
                <h4 class="font-bold text-black mb-1.5 text-xs flex items-center gap-1"><i data-lucide="message-square-dashed" class="w-3 h-3 text-orange-600 print:text-black"></i> 改善のアドバイス</h4>
                <p class="text-slate-700 leading-relaxed text-[11px] font-medium">${escapeHtml(item.feedback?.advice)}</p>
              </div>
              <div class="col-span-1 md:col-span-2 bg-slate-50 print:bg-white p-3 border border-slate-200 rounded">
                <h4 class="font-black text-black mb-1 text-[10px] tracking-wider uppercase text-slate-500">Critical Review (総合所見)</h4>
                <p class="text-slate-900 text-xs italic font-bold leading-relaxed">${escapeHtml(item.feedback?.critical_review)}</p>
              </div>
            </div>
          </div>

          <div class="mb-6">
            <h3 class="text-xs font-bold border-b border-slate-300 pb-1 mb-3 flex items-center gap-2 text-slate-600">
               <i data-lucide="file-text" class="w-4 h-4"></i> スピーチ原文
            </h3>
            <div class="p-5 bg-white border border-slate-300 rounded-lg text-black font-serif leading-[1.8] text-[12px] print:text-[11px] text-justify min-h-[200px]">
              ${originalTextHtml}
            </div>
          </div>

          <div class="border-2 border-black p-3 bg-white mt-auto">
            <div class="flex justify-between items-center mb-3">
              <h3 class="font-black text-xs tracking-widest bg-black text-white px-3 py-1 inline-block">教員 最終審査欄</h3>
              <div class="flex gap-2">
                <div class="border border-slate-300 w-12 h-12 flex items-center justify-center text-[8px] text-slate-400">審査員印</div>
                <div class="border border-slate-300 w-12 h-12 flex items-center justify-center text-[8px] text-slate-400">管理職印</div>
              </div>
            </div>
            
            <table class="w-full border-collapse border border-black text-[11px]">
              <tr>
                <td class="border border-black p-2 bg-slate-100 print:bg-slate-200 text-center font-bold w-1/4">人権・プライバシー</td>
                <td class="border border-black p-2 w-3/4">
                  <div class="flex gap-6 font-bold">
                    <label class="flex items-center gap-1"><div class="w-3 h-3 border border-black bg-white"></div> 問題なし</label>
                    <label class="flex items-center gap-1"><div class="w-3 h-3 border border-black bg-white"></div> 修正が必要</label>
                  </div>
                </td>
              </tr>
              <tr>
                <td class="border border-black p-2 bg-slate-100 print:bg-slate-200 text-center font-bold">最終判定</td>
                <td class="border border-black p-2">
                  <div class="flex gap-6 font-bold">
                    <label class="flex items-center gap-1"><div class="w-3 h-3 border border-black bg-white"></div> 学校代表</label>
                    <label class="flex items-center gap-1"><div class="w-3 h-3 border border-black bg-white"></div> 学年代表</label>
                    <label class="flex items-center gap-1"><div class="w-3 h-3 border border-black bg-white"></div> 選外</label>
                  </div>
                </td>
              </tr>
              <tr>
                <td colspan="2" class="border border-black p-2 h-16 align-top">
                  <span class="text-[9px] text-slate-500 font-bold">特記事項・修正指示（手書き）：</span>
                </td>
              </tr>
            </table>
          </div>
        `;
        
        container.appendChild(sheet);
      });
    }

    // --- モーダル制御 ---
    function showModal(index) {
      const item = dataList[index];
      if(!item) return;

      document.getElementById('modalName').textContent = item.student_name;
      const textEl = document.getElementById('modalText');
      if (item.original_text) {
        textEl.innerHTML = escapeHtml(item.original_text).replace(/\n/g, '<br/>');
      } else {
        textEl.innerHTML = '<span class="text-slate-400 italic text-center block mt-10">原文データが含まれていません。</span>';
      }

      const modal = document.getElementById('textModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.classList.add('modal-open');
    }

    function hideModal() {
      const modal = document.getElementById('textModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.classList.remove('modal-open');
    }
  </script>
</body>
</html>
